services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wellphone}
      POSTGRES_USER: ${POSTGRES_USER:-wellphone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wellphone-local-dev}
    volumes:
      - wellphone-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  ai-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: wellphone-ai-backend:local
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATABASE_URL: postgresql://${POSTGRES_USER:-wellphone}:${POSTGRES_PASSWORD:-wellphone-local-dev}@postgres:5432/${POSTGRES_DB:-wellphone}
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    ports:
      - "8787:8787"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

  task-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: wellphone-ai-backend:local
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wellphone}:${POSTGRES_PASSWORD:-wellphone-local-dev}@postgres:5432/${POSTGRES_DB:-wellphone}
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    healthcheck:
      disable: true

volumes:
  wellphone-postgres:
