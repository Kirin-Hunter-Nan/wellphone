[project]
name = "wellphone-ai-backend"
version = "0.5.0"
description = "Provider-neutral AI backend for WellPhone"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "python-dotenv>=1,<2",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
